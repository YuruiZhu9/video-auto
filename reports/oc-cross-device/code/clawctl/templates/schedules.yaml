# clawctl 任务模板 + 定时任务配置
# 路径: /workspace/reports/oc-cross-device/code/clawctl/templates/schedules.yaml

templates:
  quick-report:
    name: "快速报告"
    description: "生成今日 AI 资讯简报"
    action: spawn
    params:
      task: "生成今日 AI 资讯简报，重点关注大模型和推荐系统进展，输出结构化 Markdown 报告"
      runtime: subagent
      timeout: 300
    notify:
      on_start: true
      on_complete: true
      on_failed: true

  tech-analyst:
    name: "技术前沿分析"
    description: "追踪推荐系统+大模型技术前沿，分析招聘市场"
    action: spawn
    params:
      task: "执行技术前沿分析：\n1. 抓取 arXiv cs.IR/cs.LG 最新论文\n2. 分析推荐系统和大模型最新进展\n3. 评估对算法工程师的学习价值\n4. 输出分析报告"
      runtime: subagent
      timeout: 600
    notify:
      on_start: true
      on_complete: true
      on_failed: true

  market-insight:
    name: "商业洞察"
    description: "分析 AI 商业应用机会"
    action: spawn
    params:
      task: "分析 AI 商业应用动态：\n1. 扫描 Product Hunt / 36氪 / 虎嗅最新 AI 产品\n2. 分析企业 AI 落地案例\n3. 发现新的商业机会\n4. 输出商业机会报告"
      runtime: subagent
      timeout: 600
    notify:
      on_start: true
      on_complete: true
      on_failed: true

  full-scan:
    name: "全量扫描"
    description: "执行全量信息抓取与综合分析"
    action: spawn
    params:
      task: "执行全量信息抓取，汇总：\n1. 全球 AI 领域最新动态\n2. 国内外头部大模型厂商动态\n3. 推荐系统和大模型技术进展\n4. 生成综合分析报告"
      runtime: subagent
      timeout: 900
    notify:
      on_start: true
      on_complete: true
      on_failed: true

  github-trending:
    name: "GitHub Trending"
    description: "抓取今日 GitHub AI 相关热门项目"
    action: spawn
    params:
      task: "抓取 GitHub Trending 今日 AI 相关热门项目，分析技术栈和趋势"
      runtime: subagent
      timeout: 300
    notify:
      on_start: false
      on_complete: true
      on_failed: false

  job-market:
    name: "招聘市场分析"
    description: "分析推荐系统算法岗位招聘趋势"
    action: spawn
    params:
      task: "分析推荐系统算法工程师招聘市场：\n1. 抓取 BOSS直聘/猎聘相关岗位\n2. 分析技能要求分布\n3. 薪资范围统计\n4. 给出转行建议"
      runtime: subagent
      timeout: 600
    notify:
      on_start: true
      on_complete: true
      on_failed: true

# ── 定时任务配置 ──────────────────────────────────────────────────────────────
schedules:
  - id: daily-brief
    name: "每日早报"
    template_id: quick-report
    cron: "0 8 * * *"        # 每天 08:00 执行
    timezone: Asia/Shanghai
    enabled: true
    notify:
      on_complete: true
      channel: dingtalk
    params: {}

  - id: tech-morning
    name: "技术早读"
    template_id: tech-analyst
    cron: "0 9 * * 1,3,5"    # 周一、三、五 09:00
    timezone: Asia/Shanghai
    enabled: true
    notify:
      on_complete: true
      channel: dingtalk
    params: {}

  - id: market-weekly
    name: "商业周报"
    template_id: market-insight
    cron: "0 10 * * 5"       # 每周五 10:00
    timezone: Asia/Shanghai
    enabled: true
    notify:
      on_complete: true
      channel: dingtalk
    params: {}

  - id: github-daily
    name: "GitHub 趋势"
    template_id: github-trending
    cron: "0 22 * * *"      # 每天 22:00
    timezone: Asia/Shanghai
    enabled: false           # 默认关闭，可按需启用
    notify:
      on_complete: false
      channel: dingtalk
    params: {}

# clawctl 配置文件
# OpenClaw 跨设备控制服务

server:
  host: "0.0.0.0"
  port: 8080
  debug: false

openclaw:
  base_url: "http://localhost:18789"   # OpenClaw Gateway 地址
  api_key: "${OPENCLAW_API_KEY}"       # 从环境变量读取
  timeout: 30

auth:
  # API Key 配置（生产环境请使用强密钥）
  keys:
    - id: "read_key_001"
      key: "ck_read_a1b2c3d4e5f6"      # Read Key
      level: "read"
      name: "移动端只读"
    - id: "exec_key_001"
      key: "ck_exec_x7y8z9"            # Exec Key  
      level: "exec"
      name: "主控执行密钥"
    - id: "admin_key_001"
      key: "ck_admin_k0l1m2n3o4p5"     # Admin Key
      level: "admin"
      name: "管理员密钥"
  
  # IP 白名单（留空表示不限制）
  ip_whitelist: []
  
  # 速率限制（req/min）
  rate_limit: 60

webhook:
  secret: "${WEBHOOK_SECRET}"           # Webhook HMAC 密钥
  dingtalk:
    token: "${DINGTALK_TOKEN}"          # 钉钉机器人 Token
    secret: "${DINGTALK_SECRET}"       # 钉钉机器人加签密钥

notify:
  default_channel: "dingtalk"          # 默认通知渠道
  templates_dir: "templates"            # 消息模板目录

logging:
  level: "INFO"
  file: "logs/clawctl.log"
  audit_file: "logs/audit.log"

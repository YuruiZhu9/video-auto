<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>clawctl — OpenClaw 跨设备控制台</title>
<style>
/* ── Reset & Base ─────────────────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #0f1117;
  --surface: #1a1d27;
  --surface2: #22263a;
  --border: #2e3350;
  --text: #e8eaf6;
  --text-muted: #8b90b8;
  --accent: #5c7cfa;
  --accent2: #845ef7;
  --green: #51cf66;
  --red: #ff6b6b;
  --blue: #339af0;
  --yellow: #fcc419;
  --orange: #fd7e14;
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100dvh;
  -webkit-tap-highlight-color: transparent;
  overscroll-behavior: none;
}

/* ── Layout ───────────────────────────────────────────────────────────────── */
#app {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  padding-bottom: 72px;
}

.top-bar {
  position: sticky; top: 0; z-index: 100;
  background: rgba(15,17,23,0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.top-bar__left { display: flex; align-items: center; gap: 10px; }
.logo { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }

.bottom-nav {
  display: flex; gap: 4px;
  background: var(--surface);
  border-radius: var(--radius);
  padding: 3px;
  border: 1px solid var(--border);
}
.nav-btn {
  background: none; border: none; cursor: pointer;
  font-size: 18px; padding: 6px 10px;
  border-radius: 8px; color: var(--text-muted);
  transition: all 0.15s;
}
.nav-btn.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(92,124,250,0.4);
}
.nav-btn:active { transform: scale(0.95); }

.page {
  padding: 16px;
  max-width: 680px;
  margin: 0 auto;
  width: 100%;
}
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px;
}
.page-header h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }

/* ── Cards ────────────────────────────────────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 12px;
}
.card-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  margin-bottom: 16px;
}
.card-grid-2 {
  display: grid;
  grid-template-columns: 1fr;
  gap: 10px;
  margin-bottom: 16px;
}
@media(min-width: 480px) {
  .card-grid { grid-template-columns: repeat(4, 1fr); }
  .card-grid-2 { grid-template-columns: repeat(2, 1fr); }
}

.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 12px;
  text-align: center;
}
.stat-card__value { font-size: 28px; font-weight: 800; letter-spacing: -1px; }
.stat-card__label { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.stat-card--blue .stat-card__value { color: var(--blue); }
.stat-card--green .stat-card__value { color: var(--green); }
.stat-card--red .stat-card__value { color: var(--red); }

.section-title {
  font-size: 13px; font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase; letter-spacing: 0.5px;
  margin: 20px 0 10px;
}

/* ── Quick Grid ────────────────────────────────────────────────────────────── */
.quick-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-bottom: 8px;
}
@media(max-width: 380px) { .quick-grid { grid-template-columns: repeat(2, 1fr); } }
.quick-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px 8px 10px;
  cursor: pointer; text-align: center;
  transition: all 0.15s;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
}
.quick-btn:active { transform: scale(0.96); background: var(--surface2); }
.quick-btn__icon { font-size: 24px; }
.quick-btn__label { font-size: 11px; color: var(--text-muted); font-weight: 500; }
.quick-btn:disabled { opacity: 0.6; }

/* ── Quick Card ────────────────────────────────────────────────────────────── */
.quick-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 14px;
  display: flex; align-items: center; gap: 12px;
}
.quick-card__icon { font-size: 28px; flex-shrink: 0; }
.quick-card__body { flex: 1; min-width: 0; }
.quick-card__name { font-size: 15px; font-weight: 600; }
.quick-card__desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

/* ── Buttons ───────────────────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  background: var(--accent); color: #fff;
  border: none; border-radius: 10px;
  padding: 10px 18px; font-size: 14px; font-weight: 600;
  cursor: pointer; transition: all 0.15s;
  font-family: inherit;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn--sm { padding: 6px 12px; font-size: 12px; border-radius: 8px; background: var(--surface2); color: var(--text); }
.btn--primary { background: linear-gradient(135deg, var(--accent), var(--accent2)); }
.btn--run { background: var(--surface2); color: var(--green); border: 1px solid var(--border); padding: 7px 12px; font-size: 12px; border-radius: 8px; cursor: pointer; flex-shrink: 0; }
.btn--danger { background: rgba(255,107,107,0.15); color: var(--red); border: 1px solid var(--red); }

/* ── Inputs ────────────────────────────────────────────────────────────────── */
.input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--text);
  padding: 10px 14px; font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: border-color 0.15s;
}
.input:focus { border-color: var(--accent); }
textarea.input { resize: vertical; }

/* ── Status Row ───────────────────────────────────────────────────────────── */
.status-row {
  display: flex; justify-content: space-between; align-items: center;
  padding: 7px 0;
  border-bottom: 1px solid var(--border);
  font-size: 14px;
}
.status-row:last-child { border-bottom: none; }
.text-green { color: var(--green); }
.text-red { color: var(--red); }

/* ── Task Table ───────────────────────────────────────────────────────────── */
.table-wrap { overflow-x: auto; border-radius: var(--radius); margin-bottom: 16px; }
.task-table {
  width: 100%; border-collapse: collapse; font-size: 13px;
  background: var(--surface);
  border-radius: var(--radius);
  overflow: hidden;
}
.task-table th {
  background: var(--surface2);
  padding: 10px 12px; text-align: left;
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;
  color: var(--text-muted);
}
.task-table td {
  padding: 11px 12px;
  border-bottom: 1px solid var(--border);
}
.task-row { cursor: pointer; transition: background 0.1s; }
.task-row:hover { background: var(--surface2); }
.task-row:last-child td { border-bottom: none; }
.task-name { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-time { color: var(--text-muted); white-space: nowrap; }
.task-dur { font-variant-numeric: tabular-nums; color: var(--text-muted); }

/* ── Badges ───────────────────────────────────────────────────────────────── */
.badge {
  display: inline-block;
  padding: 3px 8px; border-radius: 20px;
  font-size: 11px; font-weight: 600;
}
.badge--success { background: rgba(81,207,102,0.15); color: var(--green); }
.badge--failed  { background: rgba(255,107,107,0.15); color: var(--red); }
.badge--running { background: rgba(51,154,240,0.15); color: var(--blue); }
.badge--pending { background: rgba(139,144,184,0.15); color: var(--text-muted); }
.badge--queued   { background: rgba(252,196,25,0.15); color: var(--yellow); }
.badge--cancelled{ background: rgba(253,126,20,0.15); color: var(--orange); }

/* ── Detail ───────────────────────────────────────────────────────────────── */
.detail-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 12px;
  font-size: 13px;
  margin-bottom: 16px;
}
.detail-label { color: var(--text-muted); font-weight: 500; }
.detail-val { font-size: 11px; word-break: break-all; }
.detail-section { margin-top: 10px; }
.detail-section summary { cursor: pointer; font-size: 13px; color: var(--accent); padding: 6px 0; }
.json-pre {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  font-size: 11px;
  font-family: 'Menlo', monospace;
  overflow-x: auto;
  max-height: 300px;
  white-space: pre-wrap;
  word-break: break-all;
  margin-top: 6px;
  color: var(--text-muted);
}
.error-text { color: var(--red) !important; }

/* ── SSE Indicator ────────────────────────────────────────────────────────── */
.sse-dot {
  width: 8px; height: 8px; border-radius: 50%;
  display: inline-block; flex-shrink: 0;
}
.sse-dot--live { background: var(--green); box-shadow: 0 0 6px var(--green); }
.sse-dot--offline { background: var(--text-muted); }
.sse-dot--error { background: var(--red); }

/* ── Toast ─────────────────────────────────────────────────────────────────── */
#toast {
  position: fixed; bottom: 84px; left: 50%; transform: translateX(-50%);
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 18px; font-size: 13px;
  z-index: 9999;
  opacity: 0; pointer-events: none;
  transition: opacity 0.2s, transform 0.2s;
  white-space: nowrap;
  max-width: 90vw;
}
.toast--show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast--success { border-color: var(--green); color: var(--green); }
.toast--error   { border-color: var(--red); color: var(--red); }
.toast--warn    { border-color: var(--yellow); color: var(--yellow); }

/* ── Bar Chart ─────────────────────────────────────────────────────────────── */
.bar-item { margin-bottom: 10px; }
.bar-label { font-size: 11px; color: var(--text-muted); margin-bottom: 3px; }
.bar-wrap { background: var(--surface2); border-radius: 6px; height: 24px; overflow: hidden; }
.bar-fill {
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  height: 100%; border-radius: 6px;
  font-size: 11px; font-weight: 700; color: #fff;
  display: flex; align-items: center; padding: 0 8px;
  min-width: 24px; white-space: nowrap;
  transition: width 0.6s ease;
}

/* ── Misc ──────────────────────────────────────────────────────────────────── */
.loading { text-align: center; padding: 48px 0; color: var(--text-muted); font-size: 14px; }
.empty { text-align: center; padding: 32px 0; color: var(--text-muted); font-size: 14px; }
.error { color: var(--red); text-align: center; padding: 24px 0; }
.form-label { font-size: 14px; color: var(--text-muted); margin-bottom: 8px; }
.scheme-label { font-size: 12px; color: var(--text-muted); margin-bottom: 8px; }
.scheme-box {
  display: flex; align-items: center; gap: 8px;
  background: var(--bg); border: 1px solid var(--border);
  border-radius: 8px; padding: 10px 12px;
}
.scheme-box code { font-size: 11px; color: var(--accent); flex: 1; word-break: break-all; }

/* ── Modal ─────────────────────────────────────────────────────────────────── */
.modal-overlay {
  position: fixed; inset: 0; z-index: 9000;
  background: rgba(0,0,0,0.7);
  backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.modal {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 100%; max-width: 480px;
  max-height: 80dvh; overflow-y: auto;
}
.modal__header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 16px 16px 12px;
  border-bottom: 1px solid var(--border);
  position: sticky; top: 0; background: var(--surface);
  border-radius: var(--radius) var(--radius) 0 0;
}
.modal__header h3 { font-size: 16px; font-weight: 700; }
.modal__close {
  background: none; border: none; cursor: pointer;
  color: var(--text-muted); font-size: 18px; padding: 4px;
}
.modal__body { padding: 16px; }

/* ── Loading spinner ──────────────────────────────────────────────────────── */
@keyframes spin { to { transform: rotate(360deg); } }
.spin::after { content: '⟳'; animation: spin 1s linear infinite; display: inline-block; }
</style>
</head>
<body>
<div id="app"></div>
<script src="dashboard.js"></script>
</body>
</html>

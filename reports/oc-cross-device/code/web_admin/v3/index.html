<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="description" content="OpenClaw 跨设备控制台 v3" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>ClawCtl v3 — 跨设备控制台</title>
  <link rel="manifest" href="/admin/manifest.json" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ═══════════════════ 顶部导航 ═══════════════════ -->
<header class="topbar">
  <div class="topbar-brand">
    <span class="logo">🤖</span>
    <span class="brand-text">ClawCtl <span class="version-badge">v3</span></span>
  </div>
  <nav class="topbar-tabs" role="tablist">
    <button class="tab active" data-tab="tasks" role="tab" aria-selected="true">
      <span class="tab-icon">📋</span>任务
    </button>
    <button class="tab" data-tab="logs" role="tab">
      <span class="tab-icon">📜</span>日志
    </button>
    <button class="tab" data-tab="dag" role="tab">
      <span class="tab-icon">🔀</span>DAG
    </button>
    <button class="tab" data-tab="status" role="tab">
      <span class="tab-icon">📊</span>状态
    </button>
  </nav>
  <div class="topbar-actions">
    <button class="btn-icon" id="btn-connect" title="连接状态" onclick="toggleConnection()">
      <span class="dot dot-red" id="conn-dot"></span>
    </button>
    <button class="btn-icon" id="btn-install" title="安装 App" onclick="installApp()" style="display:none">
      📲
    </button>
  </div>
</header>

<!-- ═══════════════════ 主内容区 ═══════════════════ -->
<main class="main-content">

  <!-- ─── 任务面板 ─── -->
  <section class="tab-panel active" id="panel-tasks">
    <div class="panel-header">
      <h2>📋 任务中心</h2>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="openNewTaskModal()">+ 新任务</button>
        <button class="btn btn-ghost" onclick="refreshTasks()">🔄 刷新</button>
      </div>
    </div>

    <!-- 快捷命令条 -->
    <div class="quick-commands">
      <input class="nl-input" id="nl-command" type="text"
             placeholder="📝 说一句话执行任务，如：帮我生成今日技术简报"
             onkeydown="if(event.key==='Enter')execNlCommand()" />
      <button class="btn btn-primary" onclick="execNlCommand()">执行</button>
    </div>

    <!-- 活跃任务列表 -->
    <div class="section-title">🔥 活跃任务</div>
    <div id="active-tasks" class="task-list">
      <div class="empty-state">暂无运行中的任务</div>
    </div>

    <!-- 历史任务列表 -->
    <div class="section-title">📦 历史任务 <span class="count-badge" id="history-count">0</span></div>
    <div id="history-tasks" class="task-list"></div>
  </section>

  <!-- ─── 实时日志面板 ─── -->
  <section class="tab-panel" id="panel-logs">
    <div class="panel-header">
      <h2>📜 实时日志</h2>
      <div class="header-actions">
        <button class="btn btn-ghost btn-sm" onclick="clearLogViewer()">清空</button>
        <button class="btn btn-ghost btn-sm" onclick="toggleAutoScroll()">自动滚动 <span id="auto-scroll-indicator">✅</span></button>
      </div>
    </div>

    <!-- 流选择器 -->
    <div class="stream-selector" id="stream-selector">
      <span class="selector-label">订阅流：</span>
      <select id="stream-select" onchange="switchStream()">
        <option value="">— 选择任务流 —</option>
      </select>
    </div>

    <!-- 日志容器 -->
    <div class="log-viewer" id="log-viewer">
      <div class="log-empty">📡 等待日志流...</div>
    </div>

    <!-- 日志控制条 -->
    <div class="log-controls">
      <label class="log-filter"><input type="checkbox" id="filter-error" onchange="applyLogFilter()" />ERROR</label>
      <label class="log-filter"><input type="checkbox" id="filter-warn" onchange="applyLogFilter()" />WARN</label>
      <label class="log-filter"><input type="checkbox" id="filter-info" checked onchange="applyLogFilter()" />INFO</label>
      <label class="log-filter"><input type="checkbox" id="filter-debug" checked onchange="applyLogFilter()" />DEBUG</label>
    </div>
  </section>

  <!-- ─── DAG 可视化 ─── -->
  <section class="tab-panel" id="panel-dag">
    <div class="panel-header">
      <h2>🔀 DAG 执行可视化</h2>
      <div class="header-actions">
        <select id="dag-select" onchange="loadDAG()">
          <option value="">— 选择 DAG 模板 —</option>
          <option value="morning-brief">🌅 晨间简报</option>
          <option value="deep-research">🔬 深度研究</option>
          <option value="ai-news-daily">📰 AI 每日资讯</option>
        </select>
        <button class="btn btn-primary" onclick="executeSelectedDAG()">▶ 执行</button>
      </div>
    </div>
    <div class="dag-container" id="dag-container">
      <div class="dag-empty">⬆ 选择一个 DAG 模板查看可视化</div>
    </div>
    <div class="dag-legend">
      <span class="legend-item"><span class="dot dot-pending"></span>待执行</span>
      <span class="legend-item"><span class="dot dot-running"></span>执行中</span>
      <span class="legend-item"><span class="dot dot-success"></span>成功</span>
      <span class="legend-item"><span class="dot dot-failed"></span>失败</span>
      <span class="legend-item"><span class="dot dot-skipped"></span>跳过</span>
    </div>
  </section>

  <!-- ─── 系统状态 ─── -->
  <section class="tab-panel" id="panel-status">
    <div class="panel-header">
      <h2>📊 系统状态</h2>
      <div class="header-actions">
        <button class="btn btn-ghost" onclick="loadStatus()">🔄 刷新</button>
      </div>
    </div>
    <div class="status-grid" id="status-grid">
      <div class="status-card">
        <div class="status-label">OpenClaw 连接</div>
        <div class="status-value" id="s-openclaw">检测中...</div>
      </div>
      <div class="status-card">
        <div class="status-label">活跃任务</div>
        <div class="status-value" id="s-active">—</div>
      </div>
      <div class="status-card">
        <div class="status-label">API 请求 (5min)</div>
        <div class="status-value" id="s-requests">—</div>
      </div>
      <div class="status-card">
        <div class="status-label">内存使用</div>
        <div class="status-value" id="s-memory">—</div>
      </div>
      <div class="status-card">
        <div class="status-label">最后刷新</div>
        <div class="status-value" id="s-last-update">—</div>
      </div>
      <div class="status-card">
        <div class="status-label">会话数</div>
        <div class="status-value" id="s-sessions">—</div>
      </div>
    </div>
    <div class="section-title" style="margin-top:1.5rem">🔔 最近告警</div>
    <div id="alert-list" class="alert-list">
      <div class="empty-state">暂无告警</div>
    </div>
  </section>
</main>

<!-- ─── 底部移动端 Tab ─── -->
<nav class="bottom-tabs" role="tablist">
  <button class="btm-tab active" data-tab="tasks"><span>📋</span><small>任务</small></button>
  <button class="btm-tab" data-tab="logs"><span>📜</span><small>日志</small></button>
  <button class="btm-tab" data-tab="dag"><span>🔀</span><small>DAG</small></button>
  <button class="btm-tab" data-tab="status"><span>📊</span><small>状态</small></button>
</nav>

<!-- ═══════════════════ 新建任务弹窗 ═══════════════════ -->
<div class="modal-overlay" id="new-task-modal" onclick="if(event.target===this)closeModal()">
  <div class="modal" role="dialog" aria-label="新建任务">
    <div class="modal-header">
      <h3>🚀 新建任务</h3>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label>任务名称</label>
        <input class="form-input" id="task-name" type="text" placeholder="如：今日技术简报" />
      </div>
      <div class="form-group">
        <label>执行类型</label>
        <select class="form-input" id="task-action">
          <option value="spawn">🔀 子 Agent（推荐）</option>
          <option value="message">💬 发送消息</option>
          <option value="cron">⏰ 定时任务</option>
        </select>
      </div>
      <div class="form-group">
        <label>Agent / 任务描述</label>
        <textarea class="form-input" id="task-params" rows="4"
          placeholder="描述你要执行的任务，NL Interpreter 会自动解析"></textarea>
      </div>
      <div class="form-group">
        <label><input type="checkbox" id="task-notify" checked /> 执行完成后通知我</label>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="submitNewTask()">▶ 执行</button>
    </div>
  </div>
</div>

<!-- ═══════════════════ 日志详情弹窗 ═══════════════════ -->
<div class="modal-overlay" id="log-detail-modal" onclick="if(event.target===this)closeLogDetail()">
  <div class="modal modal-wide" role="dialog" aria-label="日志详情">
    <div class="modal-header">
      <h3 id="log-detail-title">📜 任务日志</h3>
      <div class="header-actions">
        <button class="btn btn-ghost btn-sm" onclick="copyLogDetail()">📋 复制</button>
        <button class="btn-close" onclick="closeLogDetail()">✕</button>
      </div>
    </div>
    <div class="modal-body" style="padding:0">
      <div class="log-viewer" id="log-detail-viewer"></div>
    </div>
  </div>
</div>

<!-- ═══════════════════ Toast ═══════════════════ -->
<div class="toast-container" id="toast-container"></div>

<!-- ═══════════════════ App JS ═══════════════════ -->
<script src="app.js"></script>
</body>
</html>

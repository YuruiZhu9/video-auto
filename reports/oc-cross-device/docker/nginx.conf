# OpenClaw Cross-Device Control — Nginx 反向代理配置
# 路径: ./docker/nginx.conf

upstream clawctl_backend {
    server clawctl:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # 强制跳转到 HTTPS（证书准备好后取消注释）
    # return 301 https://$host$request_uri;

    # ── 日志 ────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/clawctl_access.log;
    error_log  /var/log/nginx/clawctl_error.log;

    # ── 安全头 ─────────────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection       "1; mode=block" always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # ── CORS（按需开启）─────────────────────────────────────────────────────
    # location /api/v1/ {
    #     add_header Access-Control-Allow-Origin "https://your-domain.com" always;
    #     add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
    #     add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
    #     if ($request_method = OPTIONS) { return 204; }
    # }

    # ── 静态资源（Web Admin）────────────────────────────────────────────────
    location / {
        root /var/www/clawctl;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── API 代理 ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://clawctl_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # 超时
        proxy_connect_timeout 10s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # SSE / 长连接
        proxy_buffering off;
        proxy_cache off;
    }

    # ── SSE 实时推送 ───────────────────────────────────────────────────────
    location /api/v1/events {
        proxy_pass         http://clawctl_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "upgrade";
        proxy_set_header   Accept           "text/event-stream";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 86400s;
        chunked_transfer_encoding on;
    }

    # ── Webhook 回调 ────────────────────────────────────────────────────────
    location /webhook/ {
        proxy_pass         http://clawctl_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 30s;
    }

    # ── 限流（按 IP）────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    location /api/v1/tasks {
        limit_req zone=api_limit burst=10 nodelay;
        proxy_pass         http://clawctl_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   Connection "";
    }
}


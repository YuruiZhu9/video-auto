# ============================================================
# OpenClaw Control — Nginx 反向代理 + HTTPS/WSS 配置
# Nginx >= 1.25（支持 HTTP/2, TLS 1.3, WebSocket upstream）
#
# 使用方式：
#   1. 复制到 /etc/nginx/sites-available/oc-control
#   2. ln -s /etc/nginx/sites-available/oc-control /etc/nginx/sites-enabled/
#   3. 修改下面的域名、证书路径、后端端口
#   4. nginx -t && systemctl reload nginx
# ============================================================

upstream oc_backend {
    server 127.0.0.1:18790;  # clawctl FastAPI 服务端口
    keepalive 32;
}

upstream oc_gateway {
    server 127.0.0.1:18789;   # OpenClaw Gateway 端口
    keepalive 16;
}

# ── HTTP → HTTPS 重定向 ─────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name oc.example.com;          # ← 修改为你的域名

    # ACME challenge（用于 Let's Encrypt 自动续期）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS 主站 ──────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name oc.example.com;           # ← 修改为你的域名

    # ── SSL 证书配置 ──────────────────────────────────────────
    # 推荐使用 Let's Encrypt + certbot 自动管理
    # certbot --nginx -d oc.example.com
    ssl_certificate     /etc/letsencrypt/live/oc.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oc.example.com/privkey.pem;

    # ── TLS 安全配置 ──────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;
    ssl_session_tickets        off;

    # ── 安全响应头 ────────────────────────────────────────────
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options           "SAMEORIGIN"    always;
    add_header X-Content-Type-Options    "nosniff"       always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin" always;
    # CSP（根据实际需要调整）
    add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' wss://oc.example.com https://oc.example.com; img-src 'self' data: https:; font-src 'self' https:;" always;

    # ── 日志 ──────────────────────────────────────────────────
    access_log /var/log/nginx/oc-control_access.log;
    error_log  /var/log/nginx/oc-control_error.log;

    # ── Gzip 压缩 ─────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;

    # ═══════════════════════════════════════════════════════════
    # 路由规则
    # ═══════════════════════════════════════════════════════════

    # ── 根路径 → Web Admin ─────────────────────────────────────
    location / {
        root  /workspace/reports/oc-cross-device/代码实现/web_admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ── clawctl FastAPI 后端 API ────────────────────────────────
    location /api/ {
        proxy_pass         http://oc_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";

        # 超时配置
        proxy_connect_timeout  15s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;

        # 真实 IP 传递（用于 IP 白名单认证）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 限流（需要 nginx 编译 ngx_http_limit_req_module）
        # limit_req zone=api_limit burst=20 nodelay;
    }

    # ── OpenClaw Gateway WebSocket（WSS）────────────────────────
    # OpenClaw 使用 WebSocket 与客户端保持长连接
    location /ws {
        proxy_pass         http://oc_gateway;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;

        # WebSocket 超时（长连接保活）
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;

        # 关闭缓存，确保实时推送
        proxy_buffering off;
        proxy_cache off;
    }

    # ── OpenClaw Gateway REST API ────────────────────────────────
    location /gateway/ {
        proxy_pass         http://oc_gateway/;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout  15s;
        proxy_send_timeout     60s;
        proxy_read_timeout     60s;
    }

    # ── 健康检查（可直接访问，不需要代理）────────────────────
    location /health {
        proxy_pass         http://oc_backend/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        access_log off;
    }

    # ── 静态资源（Web Admin）缓存 ─────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        root   /workspace/reports/oc-cross-device/代码实现/web_admin;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
}

# ── OCtrl HTTPS（同一端口，不同路径）───────────────────────────
# 如需复用同一域名分发多个服务，可参考以下路径规则
# server {
#     listen 443 ssl http2;
#     server_name your-server-ip-or-domain;
#
#     ssl_certificate     /path/to/cert.pem;
#     ssl_certificate_key /path/to/key.pem;
#
#     # 静态文件
#     location /admin/ { ... }
#     # API
#     location /api/   { ... }
#     # WebSocket
#     location /ws/    { ... }
# }
